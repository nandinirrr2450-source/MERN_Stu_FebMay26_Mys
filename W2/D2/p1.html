<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<!--starts 50 , 100 ,.......900 shades of color number can be used-->
<body class="bg-yellow-200">
    <p class="text-pink-600">Hello Tailwind CSS</p>
    <h2 class="text-blue-400 p-6 m-4">Utility Class</h2>
    <h2 class="text-blue-400 pt-6 mb-4">Utility Class</h2>
    <h2 class="text-blue-400 px-10 py-2  mt-4">Utility Class</h2>

    <div class="border-5 border-red-500 rounded-full"></div>
    <div class="border-5 border-green-500 mt-4 rounded-t-full"></div>
    <p class="text-lg"></p>My text<!--sm/base/lg/xl/2xl/3xl-->
    <p class="text-light"></p>My text<!--light/normal/bold-->
    <p class="text-center"></p>My text<!--left/center/right-->
    <button class="hover:text-red-600 hover:bg-green-700 shadow">click me</button>

    <div class="bg-yellow-200 p-4">This is a alert Message</div>
    <!--succes- green , error-red , warning/alert-yellow , information-blue -->
    <div class="bg-green-200 p-4">
        <p class="font-bold">success Message</p>
        <p>This is a success Message</p>
    </div>
    <span class="inline-flex items-center bg-blue-200 text-blue-900 px-3 py-1 rounded-full">New</span>

    <div class="border p-6 rounded">
        <h3 class="font-bold text-xl">Card Title</h3>
        <p>This is a simple description inside the cards</p>
    </div>

</body>
</html>
