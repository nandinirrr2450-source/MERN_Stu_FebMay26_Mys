<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment</title>
    <style>
        .house-roof{
            width: 500px;
            height: 25px;
            background-color: blue;
            margin-left: 500px;
        }
        .house-structure{
            width: 300px;
            height: 300px;
            background-color: lightslategray;
            margin-left: 600px;
        }
        .door{
            width: 100px;
            height: 150px;
            background-color: yellowgreen;
            position: relative;
            top: 150px;
            left: 80px;
        }
        .window{
            width: 50px;
            height: 50px;
            background-color: orange;
            position: relative;
            left: 200px;
            bottom: 90px;
        }
        .large-window{
            width: 50px;
            height: 90px;
            background-color: goldenrod;
            position: relative;
            bottom: 160px;
            left: 20px;
        }
    </style>
</head>
<body>
    <div class="house-roof"></div>
    <div class="house-structure">
        <div class="door"></div>
        <div class="window"></div>
        <div class="large-window"></div>
    </div>
    
</body>
</html>
