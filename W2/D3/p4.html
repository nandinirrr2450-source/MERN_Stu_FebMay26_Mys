<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive orientation switch</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <section class="border rounded-lg p-6 space-y-4">
        <h2>flex-col on mobile , flex-rox on md+,</h2><!--md means medium display + means greater than md-->
        <div class="border rounded p-4 flex flex-col md:flex-row gap-6">
            <div class="bg-gray-100 rounded p-4 flex-1">Block A</div>
            <div class="bg-gray-100 rounded p-4 flex-1">Block B</div>
            <div class="bg-gray-100 rounded p-4 flex-1">Block C</div>
        </div>
    </section>


        <nav class="border rounded-b-xl px-6 flex justify-between bg-red-100 flex flex-col md:flex-row ">
        <div class="flex gap-6 items-center flex flex-col md:flex-row bg-red-100">
            <a href="#" class="font-bold text-lg flex-1">Gola</a>
            <ul class="flex gap-6 text-blue-700 flex flex-col md:flex-row">
                <li><a href="#" class="hover:text-black transition flex-1">Home</a></li>
                <li><a href="#" class="hover:text-black transition flex-1">Features</a></li>
                <li><a href="#" class="hover:text-black transition flex-1">Contact</a></li>
            </ul>
        </div>
        <div class="flex gap-6 items-center flex flex-col md:flex-row bg-red-100 ">
            <a href="#" class="hover:text-black transition flex-1 m-1">Login</a>
            <button class="rounded-lg bg-black text-white hover:bg-gray-600 px-4 py-2 m-1 flex-1">Sign UP</button>

        </div>
    </nav>
    
</body>
</html>
