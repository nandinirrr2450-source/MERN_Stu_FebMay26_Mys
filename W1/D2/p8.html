<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal selector and grouping selector</title>
    <style>
        /*universal selector*/
        *{
            margin: 0;
            padding: 0;
            color: brown;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }
        /* grouping selector*/
        h1,h3{
            color: cadetblue;
        }

    </style>
</head>
<body>
    <h2>All elements have Zero Margin and zero padding</h2>
    <p>paragraph 1</p>
    <h1>This is heading tag 1</h1>
    <h3>This is heading tag 3</h3>

</body>
</html>
