<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attribute and pseudoclass selector</title>
    <style>
        /*Attribute selector*/
        input[type="text"]{
            border: 2px solid blueviolet;
            padding: 5px;
        }
        /* pseudoclass selector*/
        button:hover{
            background-color: yellow;
            color: black;
        }
    </style>
</head>
<body>
    <input type="text" placeholder="This input is styled">
    <input type="password" placeholder="This  input is not styled">
    <button> Hover on me</button>

    
</body>
</html>
