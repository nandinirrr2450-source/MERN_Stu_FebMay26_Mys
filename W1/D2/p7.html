<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS</title>
    <style>
        /* class selectors */
        .headingtype1{
            background-color: burlywood;
            font-weight: bold;

        }
        .headingtype2{
            color: blue;
        }

        /*id selector*/

        #maintitle{
            font-weight: bolder;
            text-decoration: underline;

        }



    </style>
</head>
<body>
    <!--class selector-->
    <h1 class="headingtype1">Internal CSS</h1>
    <h1 class="headingtype2">welcome to class selectors</h1>
    <p class="paratype1">This is new paragraph</p>

    <!--id selector-->
    <p id="maintitle">MAIN HEADING</p>
    
</body>
</html>
