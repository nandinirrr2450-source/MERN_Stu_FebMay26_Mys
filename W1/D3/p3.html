<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout system</title>
    <style>
        .grid-fr{
            display: grid;
            grid-template-columns: repeat(3,1fr);/* 3 equal size columns*/
            gap: 10px;/* adds spacing / gap between grids*/

        }
        .item{
            background-color: brown;
            color: aquamarine;
            padding: 20px;
        }

    </style>
</head>
<body>
 <!--Fixed width column using fractional columns-->
    <div class="grid-fr"><!--grid container-->
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>

    </div>
    
    
</body>
</html>
