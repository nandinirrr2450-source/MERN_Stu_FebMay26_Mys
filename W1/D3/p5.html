<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto fit and Auto fill</title>
    <style>
        .grid-fr{
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(150px,1fr));/* no of grid min width is 150px and max is 1fr  */
            gap: 10px;/* adds spacing / gap between grids in both col and rows*/
            /*grid-template-columns: repeat(auto-fill,minmax(150px,1fr));*/
           /* row-gap: 10px;/* adds gap only in columns*/
           margin: 10px;
        }
        .item{
            background-color: brown;
            color: aquamarine;
            padding: 20px;
        }

    </style>
</head>
<body>
 <!--Auto fit and Auto fill-->
    <div class="grid-fr"><!--grid container-->
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        
    </div>
        <div class="grid-fr"><!--grid container-->
        <div class="item">4</div>
        <div class="item">5</div>
        <div class="item">6</div>
    </div>
    
    
</body>
</html>
