<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout system</title>
    <style>
        .grid-fr{
            display: grid;
            grid-template-columns: repeat(4,1fr);/* 4 equal size columns of 1fr of width*/
            grid-template-rows: repeat(3,100px);/*3 equal size rows of 100px height*/
            gap: 10px;/* adds spacing / gap between grids*/

        }
        .item{
            background-color: brown;
            color: aquamarine;
            padding: 20px;
        }
        
         .span-column{
            grid-column: 1/3;/*col span it streches 1/3 rd */
        }
        .span-row{
            grid-row: 2/4;/*row span it streches 2/4 rd */
        }
        .span-both{
            grid-row: 1/3;/*row span it streches 1/3 rd */
            grid-column: 3/5;/*col span it streches 3/5 rd */
        }
       

    </style>
</head>
<body>
 <!--Grid lines and grid span-->
 <p>Grid lines and grid span</p>
    <div class="grid-fr"><!--grid container-->
        <div class="item">1</div>
        <div class="item span-column">Col span</div>
        <div class="item">3</div>
        <div class="item">4</div>
        <div class="item span-row">Row span</div>
        <div class="item span-both">Both span</div>
        <div class="item">7</div>
        <div class="item">8</div>

    </div>
    
    
</body>
</html>
