<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primitives</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <pre id="out">

    </pre>
    <button id="runbtn" class="px-3 py-2 rounded bg-red-100 mt-2 mb-2">
        Run
    </button>
    <script>
        const out = document.getElementById("out")
        function print(...args) {
            //console 
            console.log(...args)
            out.textContent += args.join("") + "\n"
        }
        function run() {
            clearOut()
            const name="Nandini"
            print("name = ",name," typeof = ",typeof name)
            const isloggedin = true
            print("isloggedin = ",isloggedin," typeof = ",typeof isloggedin)
            const number1 = 9.99
            print("number1 = ",number1," typeof = ",typeof number1)
            const number2 = 99
            print("number2 = ",number2," typeof = ",typeof number2)

            
        }


        function clearOut() {
            out.textContent = ""//make clear everything in screen
        }

        document.getElementById("runbtn").addEventListener("click", run)
        
    </script>

</body>

</html>
