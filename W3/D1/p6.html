<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>type conversion,dynamic,concatination</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <pre id="out">

    </pre>
    <button id="runbtn" class="px-3 py-2 rounded bg-red-100 mt-2 mb-2">
        Run
    </button>
    <script>
        const out = document.getElementById("out")
        function print(...args) {
            //console 
            console.log(...args)
            out.textContent += args.join("") + "\n"
        }
        function run() {
            clearOut()
            let value = "10"
            print("Value = ",value," Typeof = ",typeof value)
            value = 10
            print("Value = ",value," Typeof = ",typeof value)
            print("'10'+5:","10"+5)//string conversion
            print("'10'+5:","10"-5)//numeric conversion
            print("'10'==10 :","10"==10)//comparing only values
            print("'10'===10 :","10"===10)//comparing even data type
        }


        function clearOut() {
            out.textContent = ""//make clear everything in screen
            //datatypes
            const undefval = undefined;
            const nullval = null;
            print("undefval = ",undefval,"typeoff = ",typeof undefval)
            print("nullval = ",nullval,"typeof = " ,typeof nullval)

        }

        document.getElementById("runbtn").addEventListener("click", run)
        
    </script>

</body>

</html>
