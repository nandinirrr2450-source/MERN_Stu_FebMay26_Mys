<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript basics: console usage and simple dom manipulation</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <h1 class="text-2xl font-bold">My first Javascript</h1>
    <button id="runbtn" class="px-3 py-2 rounded bg-red-100 mt-2 mb-2">
        Run
    </button>
    <pre id="out">

    </pre>
    <script>
        const out = document.getElementById("out")
        //function which accepts variable number of arguments
        function print(...args) {
            //console 
            console.log(...args)
            out.textContent += args.join("") + "\n"
        }

        function run() {
            print("hello from javascript")
            print("2+3=", 2 + 3)
            document.body.style.background = "#F5C227"
        }
        document.getElementById("runbtn").addEventListener("click", run)
        run()

    </script>

</body>

</html>
