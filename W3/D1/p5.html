<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects and arrays</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <pre id="out">

    </pre>
    <button id="runbtn" class="px-3 py-2 rounded bg-red-100 mt-2 mb-2">
        Run
    </button>
    <script>
        const out = document.getElementById("out")
        function print(...args) {
            //console 
            console.log(...args)
            out.textContent += args.join("") + "\n"
        }
        function run() {
            clearOut()
            const user = {name:"Nandini",age:"22"}
            print("user=",JSON.stringify(user))

            const myarr = [1,2,3]
            myarr.push(5)
            print("is it an Array:?",Array.isArray(myarr))
            
        }


        function clearOut() {
            out.textContent = ""//make clear everything in screen
        }

        document.getElementById("runbtn").addEventListener("click", run)
        
    </script>

</body>

</html>
