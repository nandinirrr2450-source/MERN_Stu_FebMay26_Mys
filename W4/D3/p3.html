<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>saving and reading local storage</title>
</head>
<body>
    <input type="text" id="themeInput" placeholder="enter theme eg. light/dark">
    <button id="saveBtn" >Save to session storage</button>
    <button id="readBtn" >Read to session storage</button>
    <button id="removeBtn" >Remove a key from session storage</button>
    <button id="clearBtn" >Delete the session storage</button>
    <p id="output"></p>
    <script src="./p3.js"></script>
</body>
</html>
