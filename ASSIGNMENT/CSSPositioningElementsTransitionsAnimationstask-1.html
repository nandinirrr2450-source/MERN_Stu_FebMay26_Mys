<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning Elements, Transitions & Animations task-1</title>
    <style>
        body{
            background-color: cadetblue;
            height: 1500px;
        }
        .nav-bar{
            background-color: cornsilk;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            position: sticky;
            top: 0;
        }
        p{
            font-size: larger;
            font-weight: bolder;
            color: white;
        }
    </style>
</head>
<body>
    <nav class="nav-bar">
        <a href="#home">Home</a>
        <a href="#menu">Menu</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>
    <div><p>1.Create a sticky navbar that stays at the top while scrolling</p></div>
    
</body>
</html>
