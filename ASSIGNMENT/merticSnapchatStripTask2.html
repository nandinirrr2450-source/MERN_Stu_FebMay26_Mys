<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metric Snapchat Strip Task-2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">
    <div class="bg-white w-100% rounded-md m-5 h-100">
        <div class="pt-6">
            <span class="text-gray-500 pl-10">Active Users</span>
            <span class="text-gray-500 pl-10">Requests / Mins</span>
            <span class="text-gray-500 pl-10">Error Rate</span>
        </div>
        <div class="pt-1">
            <span class="text-l text-l pl-10 font-bold">12,480</span>
            <span class="text-l text-l pl-19 font-bold">1,240</span>
            <span class="text-l text-l pl-28 font-bold">2.1%</span>
        </div>
        <div class="pt-2">
            <button class="bg-green-100 w-9 h-6 text-green-700 rounded-full ml-10 font-bold text-xs">Up</button>
            <button class="bg-blue-100 w-14 h-6 text-blue-700 rounded-full ml-22 font-bold text-xs">Stable</button>
            <button class="bg-red-100 w-13 h-6 text-red-700 rounded-full ml-23 font-bold text-xs">Down</button>
        </div>
        <div class="w-350 bg-red-100 border-l-4 border-red-400 mt-5 rounded-md p-2 ml-10 ">
            <p class="text-red-700">&nbsp;Scheduled maintenance to night may briefly affect dashboard updates.</p>
        </div>
        <button class="font-bold text-xs text-white bg-blue-500 absolute top-10 left-335 p-2 rounded-md">Download Report</button>

    </div>
    
</body>
</html>
