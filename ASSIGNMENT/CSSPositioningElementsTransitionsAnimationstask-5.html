<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning Elements, Transitions & Animations task-5</title>
<style>

  body {
    position: relative;
    background-color: lavender;
  }

  .ball {
    width: 50px;
    height: 50px;
    background: red;
    border-radius: 50%;
    position: absolute;
    animation: bounce 1s infinite alternate;
  }

  @keyframes bounce {
    from { 
        top: 0;
     }
    to {
         top: 200px; 
        }
  }

</style>
</head>
<body>

<div class="ball"></div>
<p>Create a bouncing ball animation using keyframes.</p>

</body>
</html>
