<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning Elements, Transitions & Animations task-6</title>
    <!DOCTYPE html>
  <style>

    body {
      margin: 0;
    }

    .navbar {
      background-color: #333;
      padding: 15px;
    }
    .navbar a {
      color: white;
      text-decoration: none;
      margin-right: 20px;
      padding: 8px 12px;
      transition: 0.3s; 
    }

    .navbar a:hover {
      background-color: #555;
      border-radius: 5px;
    }

  </style>
</head>
<body>

  <div class="navbar">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </div>
  <p>Apply transition effects on navigation menu items.</p>
</body>
</html>
