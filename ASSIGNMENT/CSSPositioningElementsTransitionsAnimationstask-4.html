<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Positioning Elements, Transitions & Animations task-4</title>
  <style>
    .btn {
      background-color: blue;
      color: white;
      padding: 5px;
      margin-left: 100px;
      border: none;
      border-radius: 6px;
    }

    .btn:hover {
      background-color: rgb(173, 141, 173);
      transform: scale(2,1);
    }
  </style>
</head>
<body>

  <button class="btn">Hover  Me</button>
  <p>4. Animate a button hover effect.</p>

</body>
</html>
